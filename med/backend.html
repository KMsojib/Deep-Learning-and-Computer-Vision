<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Backend + QA Roadmap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#14181D;
  --surface:#1C2229;
  --surface-2:#232B33;
  --line:#2C363F;
  --text:#E8E4D8;
  --text-dim:#9AA5AC;
  --green:#3E8E5E;
  --green-dim:#2A6142;
  --yellow:#F2C94C;
  --bug:#D96C5A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:32px 16px 80px;
}
.wrap{max-width:920px;margin:0 auto;}

/* ---- Header / signature loop ---- */
header{
  display:flex;
  gap:28px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:36px;
  padding-bottom:28px;
  border-bottom:1px solid var(--line);
}
h1{
  font-family:'IBM Plex Mono',monospace;
  font-size:26px;
  font-weight:700;
  margin:0 0 6px;
  letter-spacing:-0.02em;
}
.sub{color:var(--text-dim);font-size:14px;line-height:1.5;max-width:420px;}
.loop-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
svg.loop{width:150px;height:150px;transform:rotate(-90deg);}
.loop-bg{fill:none;stroke:var(--surface-2);stroke-width:10;}
.loop-fg{fill:none;stroke:var(--green);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.loop-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;
}
.loop-pct{font-size:24px;font-weight:700;color:var(--text);}
.loop-label{font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
.loop-tags{
  position:absolute;inset:0;font-size:9px;font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
}
.loop-tags span{position:absolute;}
.lt1{top:-4px;left:50%;transform:translateX(-50%);}
.lt2{right:-32px;top:50%;transform:translateY(-50%);}
.lt3{bottom:-4px;left:50%;transform:translateX(-50%);}
.lt4{left:-24px;top:50%;transform:translateY(-50%);}

/* ---- Category tabs ---- */
.tabs{display:flex;gap:8px;margin-bottom:24px;}
.tab{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:9px 16px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text-dim);
  cursor:pointer;
  transition:all .15s ease;
}
.tab.active{background:var(--green-dim);border-color:var(--green);color:var(--text);}
.tab:hover:not(.active){border-color:var(--text-dim);}

/* ---- Section cards ---- */
.section{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:14px;
  overflow:hidden;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  cursor:pointer;
  user-select:none;
}
.section-head:hover{background:var(--surface-2);}
.section-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:14.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}
.badge{
  font-size:10px;
  font-family:'IBM Plex Mono',monospace;
  padding:2px 8px;
  border-radius:10px;
  background:var(--surface-2);
  color:var(--text-dim);
  border:1px solid var(--line);
}
.progress-mini{
  width:70px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;flex-shrink:0;
}
.progress-mini-fg{height:100%;background:var(--green);border-radius:3px;transition:width .3s ease;}
.head-right{display:flex;align-items:center;gap:12px;}
.chevron{transition:transform .2s ease;color:var(--text-dim);font-size:12px;}
.section.open .chevron{transform:rotate(90deg);}
.items{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
  border-top:1px solid transparent;
}
.section.open .items{border-top:1px solid var(--line);}
.item{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px 18px 11px 20px;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  line-height:1.45;
}
.item:last-child{border-bottom:none;}
.check{
  width:17px;height:17px;flex-shrink:0;margin-top:2px;
  border:1.5px solid var(--text-dim);
  border-radius:4px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.check.done{background:var(--green);border-color:var(--green);}
.check.done::after{content:'✓';color:var(--bg);font-size:11px;font-weight:700;}
.item-text{cursor:pointer;flex:1;}
.item.done .item-text{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--line);}
.res{display:block;font-size:11.5px;color:var(--green);margin-top:2px;text-decoration:none;}
.res:hover{text-decoration:underline;}

/* ---- Footer bar ---- */
.footer{
  margin-top:28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
}
.reset{
  background:none;border:1px solid var(--line);color:var(--bug);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;
  font-family:'IBM Plex Mono',monospace;
}
.reset:hover{border-color:var(--bug);}
.loading{color:var(--text-dim);font-size:13px;padding:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Backend Dev + QA Roadmap</h1>
      <div class="sub">Django · DRF · testing loop tracker. Build → Test → Bug → Fix → Deploy, then repeat. Progress saves automatically.</div>
    </div>
    <div class="loop-wrap">
      <svg class="loop" viewBox="0 0 150 150">
        <circle class="loop-bg" cx="75" cy="75" r="62"></circle>
        <circle id="loopFg" class="loop-fg" cx="75" cy="75" r="62" stroke-dasharray="389.6" stroke-dashoffset="389.6"></circle>
      </svg>
      <div class="loop-tags">
        <span class="lt1">Build</span>
        <span class="lt2">Test</span>
        <span class="lt3">Fix</span>
        <span class="lt4">Ship</span>
      </div>
      <div class="loop-center">
        <div class="loop-pct" id="pctText">0%</div>
        <div class="loop-label">overall</div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="backend">Backend Dev</div>
    <div class="tab" data-filter="qa">QA / SQA</div>
    <div class="tab" data-filter="project">4-Hr Project</div>
  </div>

  <div id="sections"><div class="loading">Loading your progress…</div></div>

  <div class="footer">
    <span id="counterText">0 / 0 topics checked</span>
    <button class="reset" id="resetBtn">Reset all progress</button>
  </div>
</div>

<script>
const DATA = [
 {id:"py", cat:"backend", title:"Python Foundations", items:[
   {t:"OOP: classes, inheritance, mixins, abstract base classes"},
   {t:"Decorators & context managers (e.g. transaction.atomic())"},
   {t:"Generators, iterators, *args/**kwargs, comprehensions"},
   {t:"Type hints with the typing module"},
   {t:"async/await basics"},
 ]},
 {id:"djcore", cat:"backend", title:"Django Core (Beyond CRUD)", items:[
   {t:"ORM deep dive: select_related vs prefetch_related"},
   {t:"annotate()/aggregate(), F() and Q() expressions"},
   {t:"Recognize and fix the N+1 query problem"},
   {t:"Migrations: squashing, data migrations, conflict resolution"},
   {t:"Signals (post_save, pre_delete) — and when to avoid them"},
   {t:"Writing custom middleware"},
   {t:"Class-Based View internals (MRO, mixins)"},
   {t:"Caching: per-view cache, low-level cache API, Redis backend"},
   {t:"Django admin customization (inlines, custom actions)"},
   {t:"Security defaults: CSRF, XSS, clickjacking — know why they exist"},
 ]},
 {id:"drf", cat:"backend", title:"Django REST Framework", items:[
   {t:"Serializers: ModelSerializer, nested, SerializerMethodField, custom validate()"},
   {t:"APIView vs generic views vs ViewSet + Router — when to use each"},
   {t:"Auth: Token, JWT (simplejwt), session, OAuth2 basics"},
   {t:"Permissions: built-in + custom object-level permission classes"},
   {t:"Throttling & rate limiting"},
   {t:"Pagination: PageNumber, LimitOffset, Cursor"},
   {t:"Filtering/searching: django-filter, SearchFilter, OrderingFilter"},
   {t:"API versioning strategies"},
   {t:"Testing DRF with APITestCase and APIClient"},
   {t:"Auto-docs with drf-spectacular (OpenAPI/Swagger)"},
 ]},
 {id:"async", cat:"backend", title:"Async & Background Jobs", items:[
   {t:"Celery + Redis/RabbitMQ for background tasks"},
   {t:"Periodic tasks with Celery Beat"},
   {t:"Django Channels basics (WebSockets)"},
 ]},
 {id:"db", cat:"backend", title:"Database Depth", items:[
   {t:"PostgreSQL indexing strategy"},
   {t:"Reading EXPLAIN ANALYZE output"},
   {t:"Transactions & isolation levels"},
   {t:"Connection pooling concept (pgbouncer)"},
 ]},
 {id:"deploy", cat:"backend", title:"Deployment & DevOps", items:[
   {t:"Linux basics: SSH, systemd, file permissions"},
   {t:"Gunicorn/uWSGI + Nginx as reverse proxy"},
   {t:"Docker + docker-compose for Django + Postgres + Redis"},
   {t:"Env vars & secrets with django-environ"},
   {t:"CI/CD: GitHub Actions running tests + lint on push"},
   {t:"Logging config + Sentry error monitoring"},
   {t:"Deploy to Render/Railway/DigitalOcean/AWS"},
 ]},
 {id:"qatheory", cat:"qa", title:"Testing Theory Foundations", items:[
   {t:"Test types: unit, integration, functional, regression, smoke, sanity, UAT, exploratory"},
   {t:"Test case design: equivalence partitioning, boundary value analysis"},
   {t:"Write a lightweight test plan / test case doc"},
   {t:"Bug lifecycle: New → Assigned → In Progress → Fixed → Retest → Closed/Reopened"},
   {t:"Severity vs Priority — know the difference cold"},
 ]},
 {id:"qaauto", cat:"qa", title:"Automated Testing in Your Stack", items:[
   {t:"pytest + pytest-django setup"},
   {t:"factory_boy + Faker for test data"},
   {t:"coverage.py — measure and enforce coverage"},
   {t:"Test DRF endpoints: status codes, response shape, permissions, edge cases"},
   {t:"Mocking external services (unittest.mock, responses)"},
 ]},
 {id:"apitest", cat:"qa", title:"API Testing Tools", items:[
   {t:"Postman/Insomnia: collections, environments, assertions"},
   {t:"Manually explore endpoints via generated Swagger UI"},
   {t:"Try Schemathesis for contract testing from OpenAPI schema"},
 ]},
 {id:"quality", cat:"qa", title:"Code Quality Tooling", items:[
   {t:"Linting with flake8 or ruff"},
   {t:"Formatting with black + isort"},
   {t:"Pre-commit hooks"},
   {t:"Awareness of static analysis tools (e.g. SonarQube)"},
 ]},
 {id:"perf", cat:"qa", title:"Performance & Load Testing", items:[
   {t:"Basic load test with locust"},
   {t:"Understand response time under load vs throughput"},
 ]},
 {id:"sec", cat:"qa", title:"Security Testing Basics", items:[
   {t:"Read the OWASP Top 10 fully once"},
   {t:"Try basic SQL injection / auth bypass checks on your own API"},
   {t:"Check for exposed debug info (DEBUG=True in prod, etc.)"},
 ]},
 {id:"project", cat:"project", title:"4-Hour Project: Task Manager API", items:[
   {t:"Models: User, Project, Task (status/priority/due_date/assignee)"},
   {t:"ViewSets + Router for full CRUD"},
   {t:"JWT auth with simplejwt"},
   {t:"Custom permission: only owner/assignee can edit"},
   {t:"Filtering by status/priority with django-filter"},
   {t:"Pagination configured"},
   {t:"pytest + factory_boy tests: happy path + 3 edge cases per endpoint"},
   {t:"Swagger docs via drf-spectacular"},
   {t:"Dockerfile + docker-compose (Django + Postgres)"},
   {t:"Deploy to Render/Railway"},
   {t:"Manual bug hunt: break your own API, log bugs, fix, retest"},
 ]},
];

let state = {};
const sectionsEl = document.getElementById('sections');
const pctText = document.getElementById('pctText');
const loopFg = document.getElementById('loopFg');
const counterText = document.getElementById('counterText');
const CIRC = 2 * Math.PI * 62;

function itemKey(secId, idx){ return secId + ':' + idx; }

function totalCounts(filter){
  let total = 0, done = 0;
  DATA.forEach(sec => {
    if(filter !== 'all' && sec.cat !== filter) return;
    sec.items.forEach((it, idx) => {
      total++;
      if(state[itemKey(sec.id, idx)]) done++;
    });
  });
  return {total, done};
}

function updateGlobalProgress(){
  const {total, done} = totalCounts('all');
  const pct = total ? Math.round((done/total)*100) : 0;
  pctText.textContent = pct + '%';
  loopFg.style.strokeDashoffset = CIRC - (CIRC * pct/100);
  counterText.textContent = done + ' / ' + total + ' topics checked';
}

function sectionProgress(sec){
  let done = 0;
  sec.items.forEach((it, idx) => { if(state[itemKey(sec.id, idx)]) done++; });
  return {done, total: sec.items.length};
}

let currentFilter = 'all';
let openSections = new Set();

function render(){
  sectionsEl.innerHTML = '';
  DATA.forEach(sec => {
    if(currentFilter !== 'all' && sec.cat !== currentFilter) return;
    const {done, total} = sectionProgress(sec);
    const pct = total ? Math.round((done/total)*100) : 0;
    const isOpen = openSections.has(sec.id);

    const card = document.createElement('div');
    card.className = 'section' + (isOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <div class="section-title">${sec.title} <span class="badge">${done}/${total}</span></div>
      <div class="head-right">
        <div class="progress-mini"><div class="progress-mini-fg" style="width:${pct}%"></div></div>
        <span class="chevron">▶</span>
      </div>`;
    head.addEventListener('click', () => {
      if(openSections.has(sec.id)) openSections.delete(sec.id);
      else openSections.add(sec.id);
      render();
    });

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'items';
    if(isOpen) itemsWrap.style.maxHeight = (sec.items.length * 60 + 20) + 'px';

    sec.items.forEach((it, idx) => {
      const key = itemKey(sec.id, idx);
      const checked = !!state[key];
      const row = document.createElement('div');
      row.className = 'item' + (checked ? ' done' : '');
      row.innerHTML = `<div class="check ${checked ? 'done' : ''}"></div><div class="item-text">${it.t}</div>`;
      const toggle = async () => {
        state[key] = !state[key];
        render();
        try{ await window.storage.set('roadmap-state', JSON.stringify(state)); }catch(e){ console.error('save failed', e); }
      };
      row.querySelector('.check').addEventListener('click', toggle);
      row.querySelector('.item-text').addEventListener('click', toggle);
      itemsWrap.appendChild(row);
    });

    card.appendChild(head);
    card.appendChild(itemsWrap);
    sectionsEl.appendChild(card);
  });
  updateGlobalProgress();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Reset all checked progress? This cannot be undone.')) return;
  state = {};
  try{ await window.storage.set('roadmap-state', JSON.stringify(state)); }catch(e){}
  render();
});

async function init(){
  try{
    const result = await window.storage.get('roadmap-state');
    if(result && result.value) state = JSON.parse(result.value);
  }catch(e){
    state = {};
  }
  render();
}
init();
</script>
</body>
</html>
